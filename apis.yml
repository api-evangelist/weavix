aid: weavix
name: Weavix
description: >-
  weavix is the "Internet of Workers" frontline communication and workforce
  productivity platform, built around walt, a purpose-built smart radio for
  industrial deskless workers. It replaces traditional two-way radios with a
  connected system offering push-to-talk voice, picture and video messaging,
  real-time AI language translation across 40+ languages, man-down detection,
  location tracking, geofencing, mass alerts, and searchable conversation
  capture, running over existing Wi-Fi or LTE without FCC licensing. weavix
  serves manufacturing, construction, oil and gas, food and beverage,
  warehousing, logistics, aviation and other industrial sectors. Its public
  REST API lets administrators automate the platform from outside systems:
  sync users from HR/workforce systems, manage crafts, sites, geofences and
  permission groups, send messages to channels and individual users, pull
  message history and form submissions, and trigger mass alerts. weavix is
  headquartered in Wichita, Kansas and is backed by Insight Partners and Koch
  Disruptive Technologies.
